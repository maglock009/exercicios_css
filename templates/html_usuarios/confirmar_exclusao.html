{% extends "base.html" %}

{% set title = "Excluir usuario - Portal de Exercicios" %}

{% block stylesheets %}
  <link rel="stylesheet" href="{{ url_for('static', filename='pages/usuarios.css') }}">
{% endblock %}

{% block content %}
  <section class="admin-page">
    <header class="admin-header">
      <div>
        <p class="eyebrow">Administracao</p>
        <h1>Confirmar exclusao</h1>
        <p>Deseja excluir o usuario <strong>{{ usuario.email }}</strong>?</p>
      </div>
    </header>

    <form method="post" action="{{ url_for('excluir_usuario', usuario_id=usuario.id) }}" class="admin-actions">
      <button type="submit" class="btn btn-danger">Excluir</button>
      <a class="btn btn-secondary" href="{{ url_for('usuarios') }}">Cancelar</a>
    </form>
  </section>
{% endblock %}
